name: tomeui
description: >-
  Tome UI: a Flutter UI toolkit built directly on the widgets layer,
  standalone from material and cupertino.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Default glyphs for the semantic icon tokens ([Icons.lucide]). Pure
  # icon-font data — it drags in neither material nor cupertino.
  lucide_icons_flutter: ^3.0.0
  # The tokenizer behind CodeText.block's highlighting — a pure-Dart port of
  # highlight.js that touches only flutter/painting and flutter/rendering.
  # It brings grammars, not colors: the palette does the dressing.
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    # Recursive (OFL, license alongside): one variable file — MONO, CASL,
    # wght 300–1000, slnt, CRSV — serves the whole scale, sans and mono
    # both. [Typography.recursive] dresses the type scale in it.
    - family: Recursive
      fonts:
        - asset: fonts/Recursive.ttf
    # Symbols Nerd Font Mono (MIT, license alongside): glyphs only, bound
    # as [NerdFontIcons]. The Mono cut keeps every glyph in one cell, which
    # is what an Icon wants.
    - family: SymbolsNerdFontMono
      fonts:
        - asset: fonts/SymbolsNerdFontMono.ttf
