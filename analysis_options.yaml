include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
