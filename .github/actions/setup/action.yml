name: Set up TomeUI
description: Install the Flutter and just versions used to validate releases.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.44.9'
        channel: stable
        cache: true
        pub-cache: false
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: '1.58.0'
