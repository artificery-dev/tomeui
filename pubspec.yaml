name: tomeui
description: >-
  Tome UI: a Flutter UI toolkit built directly on the widgets layer,
  standalone from material and cupertino.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Default glyphs for the semantic icon tokens ([TomeIcons.lucide]). Pure
  # icon-font data — it drags in neither material nor cupertino.
  lucide_icons_flutter: ^3.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
