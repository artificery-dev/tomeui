name: Set up TomeUI
description: Install the Flutter and just versions used to validate releases.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: '3.44.9'
        channel: stable
        cache: true
        pub-cache: false
    - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      with:
        just-version: '1.58.0'
