name: tomeui_desktop
description: >-
  The desktop window behind Tome UI: the window_manager-backed WindowShell
  that gives TitleBar a real window to drag, maximise, and close.
version: 0.3.1
repository: https://github.com/artificery-dev/tomeui/tree/main/desktop
issue_tracker: https://github.com/artificery-dev/tomeui/issues
topics:
  - desktop
  - window
platforms:
  linux:
  macos:
  windows:
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  tomeui: ^0.3.0
  # The one place in Tome the plugin is spoken to. Desktop apps take this
  # package; everything else takes tomeui alone and never ships it.
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
