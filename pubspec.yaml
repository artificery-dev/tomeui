name: tomeui
description: >-
  Tome UI: a Flutter UI toolkit built directly on the widgets layer,
  standalone from material and cupertino.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Default glyphs for the semantic icon tokens ([Icons.lucide]). Pure
  # icon-font data — it drags in neither material nor cupertino.
  lucide_icons_flutter: ^3.0.0
  # Desktop out of the box: TitleBar doubles as the window control container.
  window_manager: ^0.5.2
  # The tokenizer behind CodeText.block's highlighting — a pure-Dart port of
  # highlight.js that touches only flutter/painting and flutter/rendering.
  # It brings grammars, not colours: the palette does the dressing.
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
